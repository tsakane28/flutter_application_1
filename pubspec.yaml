name: shrinkmaster
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # CRITICAL: Core UI and responsive design
  sizer: ^3.0.1                   
  flutter_svg: ^2.0.9               

  # CRITICAL: Typography
  google_fonts: 6.1.0              

  # CRITICAL: Data persistence and connectivity
  shared_preferences: ^2.2.2        
  web: ^0.3.0                       # Downgraded to align with Flutter 3.16.0 pinning rules
  
  # Feature dependencies
  cached_network_image: ^3.3.1      
  connectivity_plus: ^5.0.2         # Downgraded to support older Dart SDK constraints
  dio: ^5.4.0                       
  fluttertoast: ^8.2.4              
  fl_chart: ^0.65.0                 
  go_router: ^12.1.3                # Downgraded to remove higher text-scaler API requirements
  flutter_application_1: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1             # Downgraded from 5.0.0 to support Dart < 3.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
